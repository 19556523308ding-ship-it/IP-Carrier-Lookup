<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="cyberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 外围数码雷达光环 -->
  <circle cx="250" cy="250" r="210" fill="none" stroke="url(#cyberGrad)" stroke-width="3" stroke-dasharray="12 18" opacity="0.6"/>
  <circle cx="250" cy="250" r="185" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.3"/>

  <!-- 经纬地球球体网格 -->
  <circle cx="250" cy="250" r="150" fill="none" stroke="url(#cyberGrad)" stroke-width="4"/>
  <ellipse cx="250" cy="250" rx="75" ry="150" fill="none" stroke="url(#cyberGrad)" stroke-width="2.5" opacity="0.7"/>
  <line x1="100" y1="250" x2="400" y2="250" stroke="url(#cyberGrad)" stroke-width="2.5" opacity="0.7"/>
  <line x1="130" y1="175" x2="370" y2="175" stroke="url(#cyberGrad)" stroke-width="1.8" opacity="0.5"/>
  <line x1="130" y1="325" x2="370" y2="325" stroke="url(#cyberGrad)" stroke-width="1.8" opacity="0.5"/>

  <!-- IP网络节点与连接脉冲 -->
  <g filter="url(#cyberGlow)">
    <!-- 核心定位光标 -->
    <circle cx="250" cy="250" r="14" fill="#06b6d4" />
    <circle cx="250" cy="250" r="28" fill="none" stroke="#06b6d4" stroke-width="3" opacity="0.75"/>
    <circle cx="250" cy="250" r="42" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.5"/>
    
    <!-- 卫星节点 -->
    <circle cx="175" cy="175" r="9" fill="#818cf8"/>
    <circle cx="325" cy="175" r="9" fill="#38bdf8"/>
    <circle cx="325" cy="325" r="9" fill="#818cf8"/>
    <circle cx="175" cy="325" r="9" fill="#06b6d4"/>

    <!-- 拓扑连接线 -->
    <line x1="250" y1="250" x2="175" y2="175" stroke="#a5b4fc" stroke-width="2"/>
    <line x1="250" y1="250" x2="325" y2="175" stroke="#38bdf8" stroke-width="2"/>
    <line x1="250" y1="250" x2="325" y2="325" stroke="#a5b4fc" stroke-width="2"/>
    <line x1="250" y1="250" x2="175" y2="325" stroke="#38bdf8" stroke-width="2"/>
  </g>
</svg>
