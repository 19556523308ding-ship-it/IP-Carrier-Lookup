<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- 极光天际渐变 -->
    <linearGradient id="auroraGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="pinBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <!-- 高级柔和立体阴影 -->
    <filter id="proShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0284c7" flood-opacity="0.32" />
    </filter>
    <filter id="softGaze" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 背景彻底纯透明，无任何灰底方框 -->

  <!-- 外围网络经纬脉冲环 -->
  <circle cx="250" cy="250" r="215" fill="none" stroke="url(#auroraGlow)" stroke-width="4.5" stroke-dasharray="14 18" opacity="0.45" />
  <circle cx="250" cy="250" r="175" fill="none" stroke="url(#auroraGlow)" stroke-width="3" opacity="0.3" />

  <!-- 经纬地球圆环 -->
  <circle cx="250" cy="250" r="150" fill="none" stroke="url(#auroraGlow)" stroke-width="7" opacity="0.75"/>
  <ellipse cx="250" cy="250" rx="75" ry="150" fill="none" stroke="url(#auroraGlow)" stroke-width="4" opacity="0.45"/>
  <line x1="100" y1="250" x2="400" y2="250" stroke="url(#auroraGlow)" stroke-width="4" opacity="0.5"/>

  <!-- 主体立体定位图钉（饱满大气，强化视觉重心） -->
  <g filter="url(#proShadow)">
    <!-- 定位针主体 -->
    <path d="M 250 85 C 185 85 135 135 135 200 C 135 285 250 395 250 395 C 250 395 365 285 365 200 C 365 135 315 85 250 85 Z" 
          fill="url(#pinBodyGrad)" />
    
    <!-- 白色中心圆槽 -->
    <circle cx="250" cy="195" r="46" fill="#ffffff" />
    
    <!-- 核心雷达微波脉冲发射点 -->
    <circle cx="250" cy="195" r="22" fill="url(#auroraGlow)" />
    <circle cx="250" cy="195" r="32" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-dasharray="6 6" opacity="0.7" />
  </g>

  <!-- 地表定位辐射脉冲点 -->
  <ellipse cx="250" cy="420" rx="65" ry="14" fill="#0d9488" opacity="0.35" filter="url(#softGaze)"/>
  <ellipse cx="250" cy="420" rx="30" ry="6" fill="#0284c7" opacity="0.6"/>
</svg>
